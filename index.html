</head>
<body class="is-home">

    <div class="nav-container">
        
        <div class="nav-group">

            <div class="sub-menu-container">

                   href="study-buddy.html"

                   data-desc="Mehr als ein E‑Book: ein KI‑gestütztes, inklusives, immersives und interaktives Lernsystem."
                   data-i18n-title="home.projects.studybuddy.title"
                   data-i18n-desc="home.projects.studybuddy.desc">
                   STUDY BUDDY
                </a>
                
                <a class="sub-item"
                   href="ar-cycling.html"
                   data-color="#457B9D"
                   data-image="assets/home/arcycling-hero-image.jpg"
                   data-dark="true"
                   data-title="Radfahren neu gedacht – mit Augmented Reality."
                   data-desc="Ein interaktives Fahrradkonzept für ein immersives, intelligentes Fahrerlebnis."
                   data-i18n-title="home.projects.arcycling.title"
                   data-i18n-desc="home.projects.arcycling.desc">
                   AR CYCLING
                </a>

                <a class="sub-item"
                   href="sinfonie.html"
                   data-color="#A8DADC"
                   data-image="assets/home/sinfonie-hero-image.jpg"
                   data-dark="true"
                   data-title="Ökologie trifft Öffentlichkeit."
                   data-desc="Ein transformierbares Entwurfssystem für das Mainufer Offenbach – modular, ökologisch, menschlich."

                   data-i18n-desc="home.projects.sinfonie.desc">
                   SINFONIE
                </a>

                <a class="sub-item"
                   hidden
                   href="this-page.html"
                   data-color="#1A1A1A"
                   data-dark="true"
                   data-title="Wie dieses Portfolio entworfen und gebaut wurde."
                   data-desc="Eine Fallstudie über die Gestaltung dieser Seite – mit Vibe Coding und Mensch-KI-Kollaboration."
                   data-i18n-title="home.projects.thispage.title"

                   THIS PAGE
                </a>
            </div>
        </div>

        <div class="nav-group">
            <a class="main-item" data-index="02" href="journals.html"
               data-color="#1A1A1A"
               data-dark="true"
               data-title=""
               data-desc="Persönliche Gedanken zu Designsystemen, zwischenmenschlichen Interaktionen und den Mechanismen des alltäglichen Lebens."

        <div class="nav-group">

        </div>
    </div>

    <div class="project-info visible" id="projectInfo">
        <div class="info-title" id="infoTitle"></div>
        <div class="info-desc" id="infoDesc" data-i18n="home.info.defaultHint" style="color: #aaa;">Hover to explore.</div>
    </div>

    <div class="footer">
        <div data-i18n="common.footer.location">Based in Germany</div>
        <div data-i18n="common.footer.copyright">© 2026 Qianyi Cheng</div>
    </div>

    <script src="i18n.js"></script>
    <script>
        const subItems = document.querySelectorAll('.sub-item');
        const body = document.body;
        const bgLayer = document.getElementById('bgLayer');
        const projectInfo = document.getElementById('projectInfo');
        const infoTitle = document.getElementById('infoTitle');
        const infoDesc = document.getElementById('infoDesc');

        // 将主菜单项（如果带有data-title）也加入悬停效果
        const hoverItems = document.querySelectorAll('.sub-item, .main-item[data-title]');

        hoverItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                // 1. 获取图片和颜色，设置背景
                const color = item.getAttribute('data-color');
                const image = item.getAttribute('data-image');
                
                if (image) {
                    bgLayer.style.backgroundImage = `url('${image}')`;
                    bgLayer.style.backgroundColor = 'transparent'; // 有图片时去掉底色，防止加载闪烁
                } else if (color) {
                    bgLayer.style.backgroundImage = 'none';
                    bgLayer.style.backgroundColor = color; // 没有图片时（如 Journals）显示纯色底色
                } else {
                    bgLayer.style.backgroundImage = 'none';
                    bgLayer.style.backgroundColor = 'transparent';
                }
                
                bgLayer.style.opacity = '1';

                // 2. 检查是否需要深色模式 (文字变白)
                const isDark = item.getAttribute('data-dark') === 'true';
                if (isDark) {
                    body.classList.add('dark-mode');
                } else {
                    body.classList.remove('dark-mode');
                }

                // 3. 更新并显示右下角信息
                infoTitle.textContent = item.getAttribute('data-title');
                infoDesc.textContent = item.getAttribute('data-desc');
                infoDesc.style.color = '';
                projectInfo.classList.add('visible');
            });

            item.addEventListener('mouseleave', () => {
                // 鼠标离开项目时，恢复默认状态
                bgLayer.style.opacity = '0';
                body.classList.remove('dark-mode');
                infoTitle.textContent = '';
                infoDesc.textContent = (window.i18n && window.i18n.t('home.info.defaultHint')) || 'Hover to explore.';
                infoDesc.style.color = '#aaa';
            });
        });

        // 当鼠标完全离开整个导航区域时，恢复默认
        document.querySelector('.nav-container').addEventListener('mouseleave', () => {
            bgLayer.style.opacity = '0';
            body.classList.remove('dark-mode');
            infoTitle.textContent = '';
            infoDesc.textContent = (window.i18n && window.i18n.t('home.info.defaultHint')) || 'Hover to explore.';
            infoDesc.style.color = '#aaa';
        });
    </script>

</body>
</html>
