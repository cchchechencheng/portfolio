<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article Title | Qianyi's Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
    /* Journal Article specific styles */
    .article-container {
        padding: 120px 20px 80px;
        max-width: 700px; /* Narrow column for optimal reading */
        margin: 0 auto;
        min-height: calc(100vh - 160px);
    }

    .article-header {
        margin-bottom: 60px;
    }

    .article-date {
        font-size: 0.9rem;
        color: #888;
        font-family: monospace;
        margin-bottom: 15px;
        display: block;
    }

    .article-title {
        font-size: clamp(2.5rem, 6vw, 4rem);
        font-weight: 800;
        line-height: 1.1;
        margin: 0;
        letter-spacing: -1px;
        color: #1a1a1a;
    }

    .article-content {
        font-size: 1.1rem;
        line-height: 1.8;
        color: #333;
    }

    .article-content p {
        margin-bottom: 24px;
    }

    .article-content h2 {
        font-size: 1.8rem;
        font-weight: 700;
        margin: 40px 0 20px;
        color: #1a1a1a;
    }

    .article-content h3 {
        font-size: 1.3rem;
        font-weight: 600;
        margin: 30px 0 15px;
        color: #1a1a1a;
    }

    .article-content ul, .article-content ol {
        padding-left: 20px;
        margin-bottom: 24px;
    }

    .article-content li {
        margin-bottom: 10px;
    }

    .article-content img {
        width: 100%;
        height: auto;
        border-radius: 4px;
        margin: 30px 0;
    }

    .article-content blockquote {
        border-left: 4px solid var(--accent-color);
        margin: 0 0 24px 0;
        padding: 10px 20px;
        font-style: italic;
        color: #555;
        background: rgba(0,0,0,0.03);
    }

    /* Back Button */
    .back-link {
        display: inline-block;
        margin-top: 60px;
        font-size: 1rem;
        font-weight: 600;
        color: #888;
        text-decoration: none;
        transition: color 0.3s ease, transform 0.3s ease;
    }

    .back-link:hover {
        color: var(--accent-color);
        transform: translateX(-5px);
    }

    @media (max-width: 768px) {
        .article-container {
            padding-top: 80px;
        }
    }
</style>
</head>
<body class="is-project">

    <!-- Navigation -->
    <nav class="project-nav">
        <a href="index.html" class="project-logo">Qianyi.</a>
    </nav>

    <!-- Article Content -->
    <article class="article-container">
        <header class="article-header">
            <time class="article-date">Date Here</time>
            <h1 class="article-title">Article Title Here</h1>
        </header>

        <div class="article-content">
            <!-- Content will be injected here -->
            <p>Content goes here...</p>
        </div>

        <a href="journals.html" class="back-link">← Back to Journals</a>
    </article>

    <!-- Footer -->
    <div class="footer">
        <div>Based in Germany</div>
        <div>© 2026 Qianyi Cheng</div>
    </div>

</body>
</html>
